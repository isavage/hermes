name: Deploy Zeno Hermes Agent

on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: Pull a fresh official Hermes image before restarting
        required: false
        default: false
        type: boolean
  push:
    branches: [main, master]
    paths-ignore: ['.gitignore', 'README.md']

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod-IN
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Upload deployment files to VPS staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,scripts/bootstrap-hermes-config.sh"
          target: "/tmp/hermes-deploy"
          overwrite: true

      - name: Pull and restart official Hermes image
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          CLEANUP: ${{ inputs.cleanup || 'false' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: DOPPLER_TOKEN,CLEANUP
          script: |
            set -euo pipefail

            TARGET_DIR="/docker/hermes"
            TEMP_DIR="/tmp/hermes-deploy"

            # Doppler CLI is required for `doppler run`. Idempotent install.
            if ! command -v doppler >/dev/null 2>&1; then
              curl -sL https://cli.doppler.com/install.sh | sh
            fi

            # Ensure the deploy target dir exists on the server. Hermes data
            # does NOT live here anymore — it is in the named Docker volume
            # `hermes-data` (mounted at /opt/data), created on first use and
            # owned entirely by Docker.
            sudo mkdir -p "$TARGET_DIR"

            # Sync tracked deployment files (docker-compose.yml, ...).
            # Hermes runtime data is NOT synced or deleted here: it lives in
            # the named volume `hermes-data`, so --delete cannot touch it.
            sudo rsync -a --delete "$TEMP_DIR"/ "$TARGET_DIR"/
            sudo rm -rf "$TEMP_DIR"

            cd "$TARGET_DIR"

            doppler run -- docker compose down || true

            # cleanup means refresh the image, not delete persistent Hermes data.
            if [ "$CLEANUP" = "true" ]; then
              doppler run -- docker image rm nousresearch/hermes-agent:latest || true
            fi

            doppler run -- docker compose pull

            # First-run bootstrap: ensures a valid config.yaml exists in the
            # named volume `hermes-data` (dashboard basic auth from Doppler,
            # _config_version: 12). Idempotent — leaves an already-provisioned
            # config untouched. Must run BEFORE `compose up` so the dashboard
            # has auth on first boot. (docker compose creates the volume if it
            # does not exist yet, but the helper container below also creates
            # it on demand.)
            sudo -E doppler run -- bash "$TARGET_DIR/scripts/bootstrap-hermes-config.sh" hermes-data

            doppler run -- docker compose up -d --force-recreate

            # Verify hermes came up. `compose up -d` can return before the
            # container is fully running, and parsing `compose ps` output is
            # fragile (caused false 255 failures even though the containers
            # were Up). Inspect the runtime state directly instead, with retry.
            state=""
            for i in $(seq 1 30); do
              state="$(docker inspect -f '{{.State.Running}}' hermes 2>/dev/null || true)"
              health="$(docker inspect -f '{{.State.Health.Status}}' hermes 2>/dev/null || true)"
              if [ "$state" = "true" ]; then
                echo "[deploy] hermes is Running (health: ${health:-n/a})"
                break
              fi
              echo "[deploy] waiting for hermes to start... ($i/30)"
              sleep 5
            done

            docker compose ps

            if [ "$state" != "true" ]; then
              echo "[deploy] ERROR: hermes container is not running." >&2
              exit 1
            fi
